name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:mono-4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable.mono ~/.local/share/godot/export_templates/ || true
      - name: Export
        working-directory: game
        run: |
          mkdir -p build/linux build/windows build/macos
          godot --headless --import || true
          godot --headless --export-release "Linux" build/linux/EconomicGame.x86_64
          godot --headless --export-release "Windows Desktop" build/windows/EconomicGame.exe
          godot --headless --export-release "macOS" build/macos/EconomicGame.zip
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: game/build
