name: CI
on:
  push:
  pull_request:
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build EconGame.sln -c Release
      - run: dotnet test EconGame.sln -c Release --no-build
      - name: Headless 30-year smoke run
        run: dotnet run --project src/Sim.Cli -c Release -- smoke --years 30
